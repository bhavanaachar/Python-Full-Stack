<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing</title>
    <style>
        body { font-family: Arial, sans-serif; }

        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid navy;
            margin: 15px;
            background: lightblue;
        }

        .content-box { box-sizing: content-box; }   /* total width 350px */
        .border-box  { box-sizing: border-box; }    /* total width 300px */
    </style>
</head>
<body>

    <div class="box content-box">
        content-box: width 300px + padding 40px + border 10px = 350px
    </div>

    <div class="box border-box">
        border-box: total width stays 300px
    </div>

</body>
</html>
